<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Pass</title>

    <link rel="stylesheet" href="transport.css">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#000000">
</head>

<body>

    <div class="page">

        <!-- Header -->

        <header class="topbar">

            <button class="back-btn" onclick="history.back()">
                ←
            </button>

            <h2>Bus Pass</h2>

        </header>



        <!-- Card -->

        <section class="bus-card">

            <!-- Background -->

            <div class="card-bg"></div>



            <!-- Top -->

            <div class="card-top">

                <img
                    src="images/passpic.jpeg"
                    class="student-photo">

                <div class="top-right">

                    <img
                        src="images/bus.png"
                        class="bus-image">

                    <div class="status">

                        Active

                    </div>

                </div>

            </div>



            <!-- Pass Number -->

            <div class="pass-number">

                Bus Pass No.26/S/6989/014

            </div>



            <!-- Student -->

            <div class="student">

                <h2>MEVADA RACHIT</h2>

                <p>(Sem-3 | 26UG010170 | SPCE-CE-3)</p>

            </div>



            <!-- Pickup -->

            <div class="info">

                <label>Pickup Point</label>

                <h3>ગઠામણ પાટીયા</h3>

            </div>



            <!-- Shift -->

            <div class="info">

                <label>Shift & Timings</label>

                <h3>

                    Shift-1 (Morning Shift)

                    <br>

                    (09:00 AM to 04:00 PM)

                </h3>

            </div>



            <!-- Duration -->

            <div class="info">

                <label>Duration</label>

                <h3>

                    01-07-2026 to 31-12-2026

                </h3>

            </div>



            <!-- Route -->

            <div class="info">

                <label>Route</label>

                <h3>

                    R007 - SPU-Palanpur 2

                </h3>

            </div>



            <!-- Fees -->

            <div class="fees">

                <div>

                    <span>Fees Amount</span>

                    <h4>₹10,500</h4>

                </div>

                <div>

                    <span>Fees Paid</span>

                    <h4>₹10,500</h4>

                </div>

                <div>

                    <span>Pending Amount</span>

                    <h4>₹0</h4>

                </div>

            </div>



            <!-- Date -->

            <div class="date">

                27-07-2026

            </div>

        </section>

    </div>

</body>

</html>
